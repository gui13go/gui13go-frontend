<main class="main" style="max-width: 960px; margin: 0 auto; padding: 24px 20px 80px;">
  <header class="gallery-header" style="margin-bottom: 28px;">
    <div class="gallery-breadcrumbs">
      <a href="/">Home</a> <span>/</span> <span>Search</span>
    </div>
    <h1 class="gallery-title" style="display: flex; align-items: center; gap: 10px;">
      <svg style="width: 28px; height: 28px; color: var(--theme-accent, #3b82f6);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Interactive Portfolio Search</span>
    </h1>
    <p class="gallery-subtitle">
      Search across technical blogs, interactive simulators, geospatial maps, and research archives.
    </p>
  </header>

  <div style="position: relative; margin-bottom: 20px;">
    <div style="display: flex; align-items: center; background: var(--entry); border: 1px solid var(--theme-border); border-radius: 14px; padding: 6px 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);">
      <svg style="width: 18px; height: 18px; color: var(--secondary); margin-right: 12px; flex-shrink: 0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        id="searchInput"
        type="search"
        placeholder="Search blogs, tools, technologies, concepts (e.g. Linux, Pomodoro, eBPF)..."
        style="width: 100%; background: transparent; border: none; outline: none; font-size: 1rem; color: var(--primary); font-family: inherit; padding: 8px 0;"
        autocomplete="off"
      />
    </div>
  </div>

  <div id="searchResults" class="searchResults" aria-label="search results" style="display: flex; flex-direction: column; gap: 14px;"></div>
</main>
