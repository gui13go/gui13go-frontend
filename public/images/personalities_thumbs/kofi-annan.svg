      <stop offset="60%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="border_kofi-annan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
